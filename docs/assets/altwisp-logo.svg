<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">ALTWISP orb logo</title>
  <desc id="desc">An indigo and violet sphere with two flowing cyan ribbons.</desc>
  <defs>
    <radialGradient id="sphere" cx="28%" cy="20%" r="90%"><stop stop-color="#9255ff"/><stop offset=".44" stop-color="#4739ed"/><stop offset="1" stop-color="#102c8a"/></radialGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63edff"/><stop offset=".55" stop-color="#13c8ed"/><stop offset="1" stop-color="#00aebc"/></linearGradient>
    <clipPath id="clip"><circle cx="128" cy="128" r="108"/></clipPath>
  </defs>
  <circle cx="128" cy="128" r="108" fill="url(#sphere)"/>
  <g clip-path="url(#clip)">
