name: Build Windows release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGNING_CONFIGURED: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install JavaScript dependencies
        working-directory: electron-app
        run: npm ci
      - name: Run tests
        working-directory: electron-app
        run: npm test
      - name: Audit JavaScript dependencies
        working-directory: electron-app
        run: npm audit --audit-level=high
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content electron-app/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and app version do not match' }
      - name: Build installer
        working-directory: electron-app
        env:
          CSC_LINK: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: npm run dist
      - name: Verify installer signature when signing is configured
        if: env.SIGNING_CONFIGURED == 'true'
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem electron-app/dist/ALTWISP-Setup-*.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $signature = Get-AuthenticodeSignature $installer[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is $($signature.Status)" }
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = @(Get-ChildItem electron-app/dist/ALTWISP-Setup-*.exe)
          if ($installer.Count -ne 1) { throw 'Expected exactly one Windows installer' }
          $checksum = (Get-FileHash $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $($installer[0].Name)" | Set-Content electron-app/dist/SHA256SUMS.txt -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $installer[0].FullName electron-app/dist/SHA256SUMS.txt --generate-notes --title $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
