name: Bug report
description: Report a reproducible ALTWISP problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Never include keys, private transcripts, recordings, or databases.
  - type: input
    id: version
    attributes:
      label: Application version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows and environment
      description: Include Windows version, display scaling, monitors, transcription mode and model.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics or screenshots
      description: Optional. Remove private data first.
