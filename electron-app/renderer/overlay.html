<!doctype html>
<html><head><meta charset="UTF-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
.orb{position:absolute;inset:4px;border-radius:50%;overflow:visible}
.orb-visual{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 28% 22%,#7b3cff 0,#234fff 40%,#04d8cf 100%);box-shadow:inset 0 0 0 1px rgba(166,212,255,.5),inset -8px -10px 16px rgba(0,16,78,.3);opacity:0;transform:translateY(8px) scale(.58);filter:blur(4px);transform-origin:50% 70%;will-change:transform,opacity,filter}
.orb-visual.active{animation:orb-enter 520ms cubic-bezier(.16,1,.3,1) both}
.reactive{position:absolute;inset:0;transform-origin:center;will-change:transform}
.fluid{position:absolute;width:150%;height:72%;left:-25%;top:40%;border-radius:44%;background:linear-gradient(100deg,#0ce0d0,#00aeea 55%,#3f57ff);transform:translate(-5%,1%) rotate(-8deg);transform-origin:center;will-change:transform,border-radius}
.fluid:before,.fluid:after{content:"";position:absolute;border-radius:50%;mix-blend-mode:screen}.fluid:before{width:58%;height:82%;left:5%;top:-36%;background:#633cffaa}.fluid:after{width:52%;height:72%;right:2%;bottom:-20%;background:#04efd6aa}
.shine{position:absolute;width:12px;height:5px;left:11px;top:9px;border-radius:50%;background:rgba(255,255,255,.3);transform:rotate(-18deg)}
@keyframes orb-enter{0%{opacity:0;transform:translateY(8px) scale(.58);filter:blur(4px)}62%{opacity:1;transform:translateY(-1px) scale(1.045);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
</style></head><body><div class="orb"><div class="orb-visual"><div class="reactive"><div class="fluid"></div><div class="shine"></div></div></div></div><script>
const orb=document.querySelector('.orb-visual');
const reactive=document.querySelector('.reactive');
const fluid=document.querySelector('.fluid');
let targetLevel=0,currentLevel=0,phase=0,lastFrame=performance.now();
function enter(){orb.classList.remove('active');void orb.offsetWidth;orb.classList.add('active')}
function animateLevel(now){const dt=Math.min(34,now-lastFrame);lastFrame=now;const easing=1-Math.pow(targetLevel>currentLevel ? .72:.86,dt/16.67);currentLevel+=(targetLevel-currentLevel)*easing;if(Math.abs(targetLevel-currentLevel)<.001)currentLevel=targetLevel;if(currentLevel>.004)phase+=dt*(.0055+currentLevel*.014);const wave=Math.sin(phase);const lift=currentLevel*(14+wave*7);const sway=currentLevel*wave*12;reactive.style.transform=`scale(${1+currentLevel*.07})`;fluid.style.transform=`translate(${-5+sway}%,${1-lift}%) rotate(${-8+currentLevel*wave*19}deg) scale(${1+currentLevel*.13})`;fluid.style.borderRadius=`${44-currentLevel*9+wave*currentLevel*5}% ${44+currentLevel*12}% ${48+currentLevel*9}% ${40+currentLevel*10}%`;requestAnimationFrame(animateLevel)}
requestAnimationFrame(animateLevel);
window.altwisp.onEvent(e=>{if(e.type==='state'){if(e.value==='starting')enter();if(e.value==='listening'&&!orb.classList.contains('active'))enter();if(e.value!=='starting'&&e.value!=='listening'){targetLevel=0;orb.classList.remove('active')}}if(e.type==='volume'){const raw=Math.min(1,Math.max(0,e.value));const gate=.012;targetLevel=raw<=gate?0:.24+.76*Math.pow((raw-gate)/(1-gate),.42)}})
</script></body></html>
