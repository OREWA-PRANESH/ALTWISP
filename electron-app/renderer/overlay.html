<!doctype html><html><head><meta charset="UTF-8"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,0)!important}.orb{position:absolute;inset:4px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 28% 22%,#7b3cff 0,#234fff 40%,#04d8cf 100%);box-shadow:inset 0 0 0 1px rgba(166,212,255,.5),inset -8px -10px 16px rgba(0,16,78,.3);transform:scale(var(--scale,1));transition:transform 55ms linear;will-change:transform}.fluid{position:absolute;width:150%;height:72%;left:-25%;top:40%;border-radius:44%;background:linear-gradient(100deg,#0ce0d0,#00aeea 55%,#3f57ff);animation:flow 2.6s ease-in-out infinite;transform-origin:center}.fluid:before,.fluid:after{content:"";position:absolute;border-radius:50%;mix-blend-mode:screen}.fluid:before{width:58%;height:82%;left:5%;top:-36%;background:#633cffaa;animation:drift 2.1s ease-in-out infinite alternate}.fluid:after{width:52%;height:72%;right:2%;bottom:-20%;background:#04efd6aa;animation:drift 1.7s ease-in-out infinite alternate-reverse}.shine{position:absolute;width:12px;height:5px;left:11px;top:9px;border-radius:50%;background:rgba(255,255,255,.3);transform:rotate(-18deg)}@keyframes flow{0%,100%{transform:translate(-5%,1%) rotate(-8deg)}50%{transform:translate(7%,-10%) rotate(9deg)}}@keyframes drift{to{transform:translate(18%,-13%) scale(1.18)}}</style></head><body><div class="orb"><div class="fluid"></div><div class="shine"></div></div><script>const root=document.documentElement;window.altwisp.onEvent(e=>{if(e.type==='volume'){const v=Math.min(1,Math.max(0,e.value));root.style.setProperty('--scale',1+v*.06);document.querySelector('.fluid').style.animationDuration=(2.6-v*1.65)+'s'}})</script></body></html>
